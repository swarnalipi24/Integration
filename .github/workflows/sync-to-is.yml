name: Push iFlows from IS_TEMP to Integration Suite

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - IS_TEMP
  workflow_dispatch:

jobs:
  upload-iflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IS_TEMP Branch
        uses: actions/checkout@v4
        with:
          ref: IS_TEMP

      - name: Upload iFlows to Design Package
        env:
          CPI_HOST: ${{ vars.CPI_HOST_URL }}
          PACKAGE_ID: ${{ vars.CPI_PACKAGE_ID }}
          TOKEN_URL: ${{ secrets.CPI_TOKEN_URL }}
          CLIENT_ID: ${{ secrets.CPI_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CPI_CLIENT_SECRET }}
        run: |
          # Clean host URLs in case https:// or trailing paths were included
          CLEAN_HOST=$(echo "$CPI_HOST" | sed -E 's|^https?://||; s|/.*$||')
          CLEAN_TOKEN_HOST=$(echo "$TOKEN_URL" | sed -E 's|^https?://||; s|/.*$||')

          # 1. Get OAuth2 Access Token
          ACCESS_TOKEN=$(curl -s -X POST "https://${CLEAN_TOKEN_HOST}/oauth/token" \
            -u "${CLIENT_ID}:${CLIENT_SECRET}" \
            -d "grant_type=client_credentials" | jq -r '.access_token')

          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Error: Failed to retrieve OAuth token. Check credentials."
            exit 1
          fi

          # 2. Fetch X-CSRF-Token and Session Cookies
          CSRF_TOKEN=$(curl -s -i -X GET "https://${CLEAN_HOST}/api/v1/" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "X-CSRF-Token: Fetch" \
            -c cookies.txt | grep -i "^x-csrf-token:" | awk '{print $2}' | tr -d '\r')

          # 3. Loop through every folder containing a META-INF directory (iFlow)
          for dir in */ ; do
            IFLOW_ID="${dir%/}"
            if [ -d "${IFLOW_ID}/META-INF" ]; then
              echo "Packaging iFlow from IS_TEMP: ${IFLOW_ID}"
              
              # Zip the contents of the iFlow folder and convert to single-line Base64
              (cd "${IFLOW_ID}" && zip -rq "../${IFLOW_ID}.zip" .)
              BASE64_CONTENT=$(base64 -w 0 "${IFLOW_ID}.zip")

              # Check if the iFlow already exists in the tenant
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "https://${CLEAN_HOST}/api/v1/IntegrationDesigntimeArtifacts(Id='${IFLOW_ID}',Version='active')")

              if [ "$HTTP_STATUS" == "200" ]; then
                echo "Updating existing iFlow: ${IFLOW_ID}"
                curl -s -f -X PUT "https://${CLEAN_HOST}/api/v1/IntegrationDesigntimeArtifacts(Id='${IFLOW_ID}',Version='active')" \
                  -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                  -H "X-CSRF-Token: ${CSRF_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -b cookies.txt \
                  -d "{\"Name\":\"${IFLOW_ID}\",\"ArtifactContent\":\"${BASE64_CONTENT}\"}"
              else
                echo "Creating new iFlow: ${IFLOW_ID}"
                curl -s -f -X POST "https://${CLEAN_HOST}/api/v1/IntegrationDesigntimeArtifacts" \
                  -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                  -H "X-CSRF-Token: ${CSRF_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -b cookies.txt \
                  -d "{\"Name\":\"${IFLOW_ID}\",\"Id\":\"${IFLOW_ID}\",\"PackageId\":\"${PACKAGE_ID}\",\"ArtifactContent\":\"${BASE64_CONTENT}\"}"
              fi
              echo "Successfully synced ${IFLOW_ID}"
            fi
          done
